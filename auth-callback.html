<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8P3Y42GBC4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8P3Y42GBC4');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in — Bipass AI</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 78% 0%, rgba(151, 141, 255, 0.2), transparent 28rem),
        radial-gradient(circle at 10% 90%, rgba(91, 188, 255, 0.14), transparent 24rem),
        #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
      position: relative;
      isolation: isolate;
    }
    body::before {
      content: '';
      position: absolute;
      z-index: -1;
      width: min(300px, calc(100vw - 32px));
      height: 174px;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 26px;
      background: rgba(255,255,255,0.74);
      box-shadow: 0 28px 80px rgba(41,53,80,0.13);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid rgba(29,29,31,0.14);
      border-top-color: #1d1d1f;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13px; color: #6e6e73; letter-spacing: -0.01em; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.5s; } }
    @media (prefers-reduced-transparency: reduce) {
      body::before { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Signing you in…</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const params    = new URLSearchParams(location.search);
      const tokenHash = params.get('token_hash');
      const next      = bipassSafeNext(params.get('next'));

      if (!tokenHash) {
        window.location.replace('/login.html?error=missing_token');
        return;
      }

      const { error } = await window.bipassAuth.client.auth.verifyOtp({
        token_hash: tokenHash,
        type: 'magiclink',
      });

      if (error) {
        console.error('Auth callback error:', error);
        window.location.replace('/login.html?error=auth_failed');
      } else {
        window.location.replace(next);
      }
    })();
  </script>
</body>
</html>
